
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <header class="topbar">

        <div class="topbar-inner">

            <div class="topbar-left">

                <div class="brand">
                    <span class="brand-icon">S</span>
                    <span class="brand-name">Swiggy</span>
                </div>

                <div class="location">
                    <span class="loc-arrow">➤</span>
                    <span>Setup your precise location</span>
                    <span class="chev">⌄</span>
                </div>

            </div>

            <div class="topbar-right">

                <div class="searchbox">
                    <input type="text"
                        placeholder="Search for restaurant and food">
                    <span class="search-icon">🔍</span>
                </div>

                <div class="user">

                    <svg viewBox="0 0 24 24"
                        width="22"
                        height="22"
                        fill="#fff">

                        <circle cx="12" cy="8" r="4"/>

                        <path d="M4 20c0-4 4-6 8-6s8 2 8 6z"/>

                    </svg>

                </div>

            </div>

        </div>

    </header>



    <main class="page">



        <section class="banner">

            <div class="banner-tag">
                <span class="tag-icon">S</span>
                <span>Food</span>
            </div>

            <h1>Order Food Online in Meerut</h1>

            <img
                class="banner-img"
                src="https://loremflickr.com/800/400/burger,noodles?lock=11"
                alt="Burger and noodles">

        </section>



        <section class="block">

            <div class="block-head">

                <h2>What's on your mind?</h2>

                <div class="arrows">

                    <button onclick="scrollRow('mind', -300)">
                        ←
                    </button>

                    <button onclick="scrollRow('mind', 300)">
                        →
                    </button>

                </div>

            </div>


            <div class="row categories" id="mind">


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/pizza?lock=21" alt="Pizza">
                    <p>Pizzas</p>
                </div>


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/curry?lock=22" alt="North Indian">
                    <p>North Indian</p>
                </div>


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/cake?lock=23" alt="Cakes">
                    <p>Cakes</p>
                </div>


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/biryani?lock=24" alt="Biryani">
                    <p>Biryani</p>
                </div>


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/chole?lock=25" alt="Chole Bhature">
                    <p>Chole Bhature</p>
                </div>


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/burger?lock=26" alt="Burgers">
                    <p>Burgers</p>
                </div>


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/wrap?lock=27" alt="Rolls">
                    <p>Rolls</p>
                </div>


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/dosa?lock=28" alt="Dosa">
                    <p>Dosa</p>
                </div>


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/dessert?lock=29" alt="Desserts">
                    <p>Desserts</p>
                </div>


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/momos?lock=30" alt="Momos">
                    <p>Momos</p>
                </div>


                <div class="cat">
                    <img src="https://loremflickr.com/200/200/noodles?lock=31" alt="Noodles">
                    <p>Noodles</p>
                </div>


            </div>

        </section>


        <hr class="divider">


    </main>



   
</body>

</html>
